<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get a Quote - Intersteller Infotech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">O</span>
      <h2>Intersteller Infotech</h2>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Quote Section -->
  <section class="quote-container">
    <div class="quote-card">
      <span class="badge">Request a Estimate</span>
      <h1>Get a Custom Quote</h1>
      <p>Fill out the form below to get a detailed project estimation for your organization.</p>

      <form action="#" method="POST" class="quote-form">
        <div class="form-group-row">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="email">Work Email</label>
            <input type="email" id="email" placeholder="john@company.com" required>
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="org">Organization / Institution Name</label>
            <input type="text" id="org" placeholder="School, College, or Company name" required>
          </div>
          <div class="form-group">
            <label for="service">Select Service</label>
            <select id="service" required>
              <option value="" disabled selected>Choose a Service</option>
              <option value="online-exam">Online Examination Platform</option>
              <option value="it-infrastructure">IT Infrastructure Setup</option>
              <option value="learning-system">Smarter Learning Systems</option>
              <option value="custom">Custom Enterprise Solutions</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="budget">Estimated Budget ($)</label>
          <select id="budget">
            <option value="small">$1,000 - $5,000</option>
            <option value="medium">$5,000 - $15,000</option>
            <option value="large">$15,000+</option>
          </select>
        </div>

        <div class="form-group">
          <label for="details">Project Requirements / Details</label>
          <textarea id="details" rows="5" placeholder="Describe your project, expected scale, timeline, and specific needs..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Quote Request</button>
      </form>
    </div>
  </section>

</body>
</html>
